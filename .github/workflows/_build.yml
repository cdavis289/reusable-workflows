---
name: Build

on: # yamllint disable-line rule:truthy
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - develop
      - develop-*
  release:
    types:
      - edited
      - published
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  diagnostics:
    name: Diagnostics
    uses: ./.github/workflows/diagnostics.yml

  config:
    name: Config
    uses: ./.github/workflows/_config.yml

  lint:
    name: Lint
    uses: ./.github/workflows/common-lint.yml

  build:
    name: Build and Publish Container
    needs:
      - config
      - lint
      - diagnostics
    # Skip registry-pushing jobs on fork PRs — secrets are unavailable and
    # GITHUB_TOKEN is read-only, so pushes would fail with auth errors.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/container-build.yml
    with:
      platforms: ${{ needs.config.outputs.platforms }}
      image-name: ${{ needs.config.outputs.image_name }}
      context: .
      dockerfile: ./Dockerfile
      scan-severity: CRITICAL,HIGH

  test:
    name: Test Container
    needs:
      - config
      - build
    uses: ./.github/workflows/container-test.yml
    permissions:
      actions: read
      contents: read
      packages: read
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.test_platforms }}

  publish-manifest:
    name: Publish Manifest
    needs:
      - config
      - build
      - test
    uses: ./.github/workflows/container-publish-manifest.yml
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.platforms }}

  ci-gate:
    name: CI Gate
    needs:
      - config
      - lint
      - diagnostics
      - build
      - test
      - publish-manifest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          CONFIG: ${{ needs.config.result }}
          LINT: ${{ needs.lint.result }}
          DIAGNOSTICS: ${{ needs.diagnostics.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          PUBLISH_MANIFEST: ${{ needs.publish-manifest.result }}
        run: |
          set -Eeuo pipefail

          failed=0

          check_result() {
            local name="$1"
            local result="$2"

            case "$result" in
              success|skipped)
                echo "✓ ${name}: ${result}"
                ;;
              *)
                echo "::error::${name}: ${result}"
                failed=1
                ;;
            esac
          }

          check_result "Config" "$CONFIG"
          check_result "Lint" "$LINT"
          check_result "Diagnostics" "$DIAGNOSTICS"
          check_result "Build" "$BUILD"
          check_result "Test" "$TEST"
          check_result "Publish Manifest" "$PUBLISH_MANIFEST"

          exit "$failed"
